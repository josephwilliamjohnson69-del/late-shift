<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Late Shift - Hybrid Protocol</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: white; touch-action: none; }
        #hands-display {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 2px solid #0f0; padding: 10px; border-radius: 5px; text-align: center; z-index: 20; width: 300px;
        }
        .ingredient-slot { display: inline-block; width: 80px; height: 30px; border: 1px dashed #444; margin: 0 5px; line-height: 30px; font-size: 12px; }
        .filled { background: #0f0; color: #000; font-weight: bold; }
        
        /* CONTROLS OVERLAY */
        #joystick-container { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #0f0; display: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #0f0; border-radius: 50%; opacity: 0.5; }
        
        #mobile-btns { position: absolute; bottom: 40px; right: 40px; display: none; flex-direction: column; gap: 10px; }
        .m-btn { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 3px solid white; }
        #btn-reject { background: rgba(255,0,0,0.5); border-color: red; }
        #btn-cook { background: rgba(255,255,0,0.5); border-color: yellow; color: black; display: none; }

        #ui { position: absolute; top: 10px; left: 10px; color: #0f0; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #progress-container { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 200px; height: 15px; border: 2px solid #fff; display: none; }
        #progress-bar { width: 0%; height: 100%; background: #0f0; }
        #start-screen { position:fixed; width:100%; height:100%; background:#000; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align: center; }
        .btn { background: #f00; color: #fff; border: none; padding: 15px 40px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color:red;">LATE SHIFT</h1>
        <p>PC: WASD + Mouse + E/R/G<br>Mobile: Joystick + Tap + Buttons</p>
        <button class="btn" onclick="startGame()">START SHIFT</button>
    </div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="mobile-btns">
        <div id="btn-cook" class="m-btn">COOK</div>
        <div id="btn-reject" class="m-btn">REJECT</div>
    </div>

    <div id="hands-display">
        <div id="slot-1" class="ingredient-slot">EMPTY</div>
        <div id="slot-2" class="ingredient-slot">EMPTY</div>
        <div id="slot-3" class="ingredient-slot">EMPTY</div>
        <div id="final-item" style="color:yellow; font-weight:bold; margin-top:5px;"></div>
    </div>

    <div id="ui">CASH: $<span id="cash">0</span></div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="crosshair"></div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let cash = 0, currentCustomer = null, gameActive = false, inventory = [];
        let yaw = 0, pitch = 0, gProgress = 0, isHoldingG = false;
        let moveX = 0, moveZ = 0, keys = {};

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- DETECT DEVICE ---
        const isMobile = /Android|iPhone/i.test(navigator.userAgent);
        if(isMobile) {
            document.getElementById('joystick-container').style.display = 'block';
            document.getElementById('mobile-btns').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'none';
        }

        // --- WORLD ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const counter = new THREE.Mesh(new THREE.BoxGeometry(8, 1.1, 2), new THREE.MeshStandardMaterial({color: 0x221100}));
        counter.position.set(0, 0.55, -2); scene.add(counter);
        
        function makeItem(x, color, name) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), new THREE.MeshStandardMaterial({color: color}));
            m.position.set(x, 1.15, -2.3); m.name = name; scene.add(m);
        }
        makeItem(-1.5, 0xd2b48c, "Bread"); makeItem(-0.5, 0x800000, "Meat"); makeItem(0.5, 0x2ecc71, "Lettuce"); makeItem(1.5, 0xe74c3c, "Tomato");

        // --- PC CONTROLS ---
        window.addEventListener('keydown', (e) => { 
            keys[e.code] = true; 
            if(e.code === 'KeyE') interact();
            if(e.code === 'KeyR') reject();
            if(e.code === 'KeyG') isHoldingG = true;
        });
        window.addEventListener('keyup', (e) => { 
            keys[e.code] = false; 
            if(e.code === 'KeyG') { isHoldingG = false; gProgress = 0; document.getElementById('progress-container').style.display='none'; }
        });
        window.addEventListener('mousemove', (e) => {
            if(gameActive && !isMobile) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        // --- MOBILE CONTROLS ---
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if(!isMobile) return;
            const t = e.touches[0];
            if(t.clientX < window.innerWidth / 2) { touchStartX = t.clientX; touchStartY = t.clientY; }
            else { interact(t.clientX, t.clientY); }
        });

        // --- SHARED LOGIC ---
        function interact(tx, ty) {
            const mouse = new THREE.Vector2();
            if(tx !== undefined) {
                mouse.x = (tx / window.innerWidth) * 2 - 1;
                mouse.y = -(ty / window.innerHeight) * 2 + 1;
            }
            const ray = new THREE.Raycaster();
            ray.setFromCamera(mouse, camera);
            const inter = ray.intersectObjects(scene.children);
            if(inter.length > 0) {
                const o = inter[0].object;
                if(["Bread", "Meat", "Lettuce", "Tomato"].includes(o.name) && inventory.length < 3) {
                    inventory.push(o.name); updateUI();
                }
                if(o.parent === currentCustomer || o === currentCustomer) {
                    if(document.getElementById('final-item').innerText === "READY") serve();
                }
            }
        }

        function spawn() {
            if(currentCustomer) scene.remove(currentCustomer);
            currentCustomer = new THREE.Group();
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4), new THREE.MeshStandardMaterial({color:0xffdbac}));
            h.position.y = 1.7; currentCustomer.add(h);
            currentCustomer.position.set(0, 0, -10);
            currentCustomer.userData = { isAnomaly: Math.random() > 0.5 };
            scene.add(currentCustomer);
        }

        function updateUI() {
            for(let i=1; i<=3; i++) document.getElementById(`slot-${i}`).innerText = inventory[i-1] || "EMPTY";
            document.getElementById('btn-cook').style.display = (inventory.length === 3) ? "flex" : "none";
        }

        function serve() {
            if(currentCustomer.userData.isAnomaly) alert("JUMPSCARE!");
            else { cash+=50; reset(); }
        }
        function reject() {
            if(currentCustomer.userData.isAnomaly) { cash+=25; reset(); }
            else alert("JUMPSCARE!");
        }
        function reset() { inventory=[]; updateUI(); document.getElementById('final-item').innerText=""; spawn(); document.getElementById('cash').innerText=cash; }

        window.startGame = () => { 
            document.getElementById('start-screen').style.display='none'; 
            if(!isMobile) document.body.requestPointerLock();
            gameActive=true; camera.position.set(0, 1.7, 1); spawn(); animate(); 
        };

        function animate() {
            if(!gameActive) return; requestAnimationFrame(animate);
            
            // Movement Logic (PC + Mobile)
            const s = 0.08;
            if(keys['KeyW']) camera.translateZ(-s);
            if(keys['KeyS']) camera.translateZ(s);
            if(keys['KeyA']) camera.translateX(-s);
            if(keys['KeyD']) camera.translateX(s);
            
            camera.position.y = 1.7; // Keep player on ground

            // Cooking Logic
            if(isHoldingG && inventory.length === 3) {
                gProgress += 1;
                document.getElementById('progress-container').style.display='block';
                document.getElementById('progress-bar').style.width = gProgress+'%';
                if(gProgress>=100) { document.getElementById('final-item').innerText="READY"; isHoldingG=false; }
            }

            if(currentCustomer.position.z < -3.5) currentCustomer.position.z += 0.03;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
